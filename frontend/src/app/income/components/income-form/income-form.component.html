<div class="income-form-card" [class.editing]="incomeToEdit">
  <div class="form-header">
    <h3>{{ incomeToEdit ? 'Editar ingreso' : 'Registrar ingreso' }}</h3>
  </div>

  <form (ngSubmit)="submit()" class="form-body">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">
          <span class="label-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          </span> Monto (Q)
        </label>
        <input type="number" step="0.01" min="0" [(ngModel)]="amount" name="amount"
          class="form-input" placeholder="0.00" required />
      </div>

      <div class="form-group">
        <label class="form-label">
          <span class="label-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          </span> Fuente
        </label>
        <select [(ngModel)]="source" name="source" class="form-input" required>
          <option value="" disabled>Selecciona una fuente</option>
          <option *ngFor="let src of sources" [value]="src">{{ src }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">
          <span class="label-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          </span> Descripción
        </label>
        <input type="text" [(ngModel)]="description" name="description"
          class="form-input" placeholder="Detalles del ingreso (opcional)" />
      </div>

      <div class="form-group">
        <label class="form-label">
          <span class="label-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          </span> Fecha y hora
        </label>
        <input type="datetime-local" [(ngModel)]="transactionDate" name="transactionDate"
          class="form-input" [max]="maxDate" required />
      </div>
    </div>

    <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="form-actions">
      <button type="submit" class="btn-save">
        <span>{{ incomeToEdit ? 'Guardar cambios' : 'Registrar ingreso' }}</span>
        <span class="btn-arrow">→</span>
      </button>
      <button type="button" class="btn-cancel" *ngIf="incomeToEdit" (click)="cancel()">
        Cancelar
      </button>
    </div>
  </form>
</div>
